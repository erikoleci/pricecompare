# ==============================================================
# PriceCompare Backend - Application Configuration
# ==============================================================

quarkus.application.name=pricecompare-backend

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=pricecompare
quarkus.datasource.password=pricecompare_dev_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pricecompare

# Flyway owns the schema (db/001_init_schema.sql content is mirrored into
# src/main/resources/db/migration as V1__init_schema.sql / V2__seed.sql)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Hibernate should validate against Flyway-managed schema, never auto-generate it
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Redis (caching, rate-limit counters, crawler job locks) ---
quarkus.redis.hosts=redis://localhost:6379

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true

# --- Environment profiles ---
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pricecompare
%test.quarkus.datasource.db-kind=h2
