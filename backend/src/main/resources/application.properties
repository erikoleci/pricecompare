# ==============================================================
# PriceCompare Backend - Application Configuration
# ==============================================================

quarkus.application.name=pricecompare-backend

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:pricecompare}
quarkus.datasource.password=${DB_PASSWORD:pricecompare_dev_password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/pricecompare}

# Flyway owns the schema (db/*.sql is mirrored into src/main/resources/db/migration
# as V1__init_schema.sql, V2__..., etc. - keep both in sync when adding a migration)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Hibernate should validate against Flyway-managed schema, never auto-generate it
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Redis (caching, rate-limit counters, crawler job locks) ---
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# --- HTTP ---
quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true

# --- Environment profiles ---
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pricecompare
%test.quarkus.datasource.db-kind=h2
