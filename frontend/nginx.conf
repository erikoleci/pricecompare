server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode - any non-file path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL: index.html must never be cached. Vite content-hashes every
    # JS/CSS chunk filename, so every deploy that changes a file produces a
    # NEW filename. If index.html is cached from before the latest deploy,
    # it still points at the OLD hashed filenames, which no longer exist on
    # disk after the new build replaced them - that's exactly the
    # "Failed to fetch dynamically imported module" / 404-on-old-hash error.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Hashed assets are safe to cache forever - a changed file always gets a
    # new filename, so there's no such thing as a "stale" hashed asset.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API calls to the backend service. BACKEND_HOST is resolved by
    # docker-compose's internal DNS (service name "backend") or, on a
    # platform without compose networking, replace with the backend's
    # public URL at build/deploy time.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
