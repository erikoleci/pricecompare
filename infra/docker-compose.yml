version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pricecompare-postgres
    environment:
      POSTGRES_DB: pricecompare
      POSTGRES_USER: pricecompare
      POSTGRES_PASSWORD: pricecompare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricecompare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pricecompare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Uncomment once Phase 5 (search) starts:
  # opensearch:
  #   image: opensearchproject/opensearch:2.15.0
  #   container_name: pricecompare-opensearch
  #   environment:
  #     - discovery.type=single-node
  #     - plugins.security.disabled=true
  #     - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"

volumes:
  pgdata:
